name: IQ2020 controls tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_controls.py' -v
        env:
          CXX: clang++
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [minimal, chemistry, controls, select-without-number, text-only, salt-sensor, iq-ph-only, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python tests/esphome/test_controls_schemas.py -v
      - run: python tests/esphome/check.py --stage compile --case "${{ matrix.config }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-firmware-${{ matrix.config }}
          path: |
            tests/.work/*.log
            tests/.work/*.json
