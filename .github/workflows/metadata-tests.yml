name: IQ2020 metadata tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python tests/esphome/test_metadata_schemas.py -v
      - run: python tests/esphome/check.py --stage compile --case "${{ matrix.config }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-firmware-${{ matrix.config }}
          path: |
            tests/.work/*.log
            tests/.work/*.json
